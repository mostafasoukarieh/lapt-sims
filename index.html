<!doctype html>
<html lang="en" data-root="./">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>LAPT</title>
  <link rel="icon" href="shared/img/icon-192.png">
  <link rel="stylesheet" href="shared/base.css">
  <style>
    .cat { max-width: 1240px; margin: 0 auto; padding: 12px 16px 32px; }
    .cat-sub { margin: 4px 0 16px; color: var(--muted); }
    .class-head { font-size: 1.05rem; margin: 20px 0 10px; display: flex; align-items: baseline; gap: 8px; }
    .class-head .count { color: var(--muted); font-size: 0.85rem; font-weight: 400; }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .sim-card {
      display: grid; grid-template-rows: auto 1fr; text-decoration: none; color: inherit;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
    }
    .sim-card:hover { border-color: var(--primary); }
    .sim-card img { width: 100%; aspect-ratio: 8 / 5; object-fit: cover; display: block; background: var(--scene-bg); }
    .sim-card .body { padding: 10px 12px 12px; display: grid; gap: 4px; align-content: start; }
    .sim-card h3 { font-size: 1rem; margin: 0; }
    .sim-card .chap { font-size: 0.82rem; color: var(--muted); }
    .sim-card p { margin: 0; font-size: 0.9rem; }
    .badge { justify-self: start; font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: #ffffff; font-weight: 700; }
    .hero { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin: 8px 0 12px; }
    .hero-logo { background: #ffffff; border-radius: 14px; padding: 8px 12px; border: 1px solid var(--border); }
    .hero-logo img { display: block; width: min(280px, 70vw); height: auto; }
    @media (prefers-color-scheme: dark) { .hero-logo { background: transparent; border-color: transparent; padding-left: 0; } }
    .class-nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
    .class-nav a {
      flex: 0 0 auto; min-height: 44px; display: inline-grid; place-items: center; padding: 0 14px;
      border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--text); text-decoration: none; font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1 data-i18n="cat.title"></h1>
    <div class="lang-toggle" role="group" aria-label="EN | FR">
      <button type="button" data-lang-btn="en">EN</button>
      <button type="button" data-lang-btn="fr">FR</button>
    </div>
  </header>
  <main class="cat">
    <div class="hero">
      <a class="hero-logo" href="https://apt-lb.net"><picture><source srcset="shared/img/lapt-logo-dark.svg" media="(prefers-color-scheme: dark)"><img src="shared/img/lapt-logo.svg" alt="LAPT — تجمع أساتذة الفيزياء في لبنان — Lebanese Association of Physics Teachers" width="1108" height="668"></picture></a>
    </div>
    <nav class="class-nav" id="class-nav"></nav>
    <div id="list"></div>
  </main>

  <script type="module">
    import { addStrings, applyI18n, setLang, getLang, onLangChange, t } from './shared/i18n.js';
    import shared from './shared/strings.js';
    import { CLASSES } from './shared/classes.js';
    import { el } from './shared/controls.js';

    addStrings(shared);
    document.querySelectorAll('[data-lang-btn]').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.langBtn)));

    // Drafts are hidden in the app; open index.html?drafts=1 to review them.
    const showDrafts = new URLSearchParams(location.search).has('drafts');
    let catalog = [];

    function render() {
      const lang = getLang();
      const list = document.getElementById('list');
      const nav = document.getElementById('class-nav');
      list.replaceChildren();
      nav.replaceChildren();
      const visible = catalog.filter((s) => s.status === 'ready' || showDrafts);
      for (const c of CLASSES) {
        const sims = visible.filter((s) => (s.grades || [s.grade]).includes(c.id));
        if (!sims.length) continue;
        nav.append(el('a', { href: `#${c.id}` }, c[lang]));
        list.append(el('h2', { class: 'class-head', id: c.id }, [c[lang], el('span', { class: 'count' }, `(${sims.length})`)]));
        const grid = el('div', { class: 'grid' });
        for (const s of sims) {
          grid.append(el('a', { class: 'sim-card', href: s.path + 'index.html' }, [
            el('img', { src: s.thumb, alt: '', loading: 'lazy' }),
            el('div', { class: 'body' }, [
              s.status === 'draft' ? el('span', { class: 'badge' }, t('cat.draft')) : null,
              el('h3', {}, s.title[lang]),
              el('span', { class: 'chap' }, s.chapter[lang]),
              el('p', {}, s.summary[lang]),
            ]),
          ]));
        }
        list.append(grid);
      }
      if (!list.children.length) list.append(el('p', { class: 'muted' }, t('cat.empty')));
      document.title = `${t('cat.title')} — LAPT`;
    }

    onLangChange(render);
    applyI18n();
    fetch('catalog.json').then((r) => r.json()).then((data) => { catalog = data; render(); }).catch(() => render());
  </script>
</body>
</html>
